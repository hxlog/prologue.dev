name: Deploy (Cloudflare static export)

# Manual dispatch is always allowed. The push trigger is gated by the repo
# variable DEPLOY_CLOUDFLARE so a half-migrated branch cannot publish over
# production until the cutover is approved:
#   gh variable set DEPLOY_CLOUDFLARE --body true
on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.DEPLOY_CLOUDFLARE == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Locate Yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build static export
        run: yarn export

      - name: Verify export output
        run: node scripts/verify-export.mjs

      - name: Deploy to Cloudflare Workers (assets-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler deploy --config wrangler.jsonc

      # Static-export assets are content-hashed, but HTML and RSC payloads must
      # never mix versions across a deploy for a client that already has the old
      # HTML. Workers Assets is versioned; this purge also clears anything else
      # Cloudflare cached for the zone, so a cold visitor always gets one build.
      # out/_headers now sends s-maxage=31536000 for HTML and RSC payloads, so
      # the purge is the only thing that makes a new deployment visible at the
      # edge: fail the job on an API error instead of leaving a year-old cache.
      - name: Purge edge cache
        env:
          CLOUDFLARE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
        run: |
          response="$(curl -sS --fail-with-body -X POST "https://api.cloudflare.com/client/v4/zones/0bf0102de76cab34ef6089be6d6dc95a/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_PURGE_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')"
          echo "$response"
          echo "$response" | grep -Eq '"success"[[:space:]]*:[[:space:]]*true'

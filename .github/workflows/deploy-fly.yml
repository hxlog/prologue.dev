name: Deploy to Fly.io

# Runs only after the CI workflow succeeds on master. The Fly build is the same
# production build as CI's, executed by the remote builder from the Dockerfile.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-fly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On workflow_run, github.sha is the default branch tip, not necessarily
          # the commit CI just validated. Deploy exactly that commit.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: |
          flyctl deploy --remote-only \
            --build-arg DEPLOYMENT_ID=${{ github.event.workflow_run.head_sha || github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # The site is build-only: Cloudflare can hold HTML/RSC/feeds for a year,
      # and a successful deploy is the invalidation signal. Use the scoped
      # Cache Purge token (never the global key). Retry because the free plan
      # rate-limits purge requests to 5/minute.
      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/purge.json -w '%{http_code}' -X POST \
              "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_CACHE_PURGE_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}')
            if [ "$code" = "200" ] && grep -q '"success":true' /tmp/purge.json; then
              echo "Cloudflare cache purged"
              exit 0
            fi
            echo "purge attempt $attempt failed (HTTP $code)"
            cat /tmp/purge.json || true
            sleep 5
          done
          echo "Cloudflare purge failed after retries"
          exit 1
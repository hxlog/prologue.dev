# Yarn 4 (Berry) — the "stable" line. The release is pinned by the
# "packageManager" field in package.json; run `corepack enable` once so the
# `yarn` on your PATH honours it (CI does the same, see .github/workflows).
#
# node-modules instead of the default Plug'n'Play linker: Next.js (and its
# Turbopack resolver) does not support PnP, and Vercel installs with
# node_modules. Everything else about Berry — the lockfile format, the
# immutable installs, the global cache — still applies.
nodeLinker: node-modules

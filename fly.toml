# Fly.io app for prologue.dev. Region sin (Singapore): closest Fly region for
# the target audience (no Fly region in Hong Kong; sin beat nrt in our probes).
# One always-on 256 MB shared-cpu-1x Machine fits the legacy Hobby free
# allowance (up to 3x 256 MB VMs); Cloudflare in front keeps egress low.
app = "prologue-dev"
primary_region = "sin"

kill_signal = "SIGINT"
kill_timeout = 30
# Small RAM buffer for sharp/Satori spikes on a 256 MB Machine. 512 MB disk
# swap, no volume: the Machine rootfs is ephemeral and every deploy refreshes it.
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  HOSTNAME = "0.0.0.0"
  NEXT_TELEMETRY_DISABLED = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  # /robots.txt is a 477-byte static response: cheap enough to poll every 30 s,
  # and it cannot trigger a render. force_https only rewrites public proxy
  # traffic, but the header keeps the check on the https path regardless.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/robots.txt"
    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

[deploy]
  # Zero-downtime with a single Machine: Fly starts the replacement, waits for
  # the health check, switches traffic, then stops the old Machine.
  strategy = "bluegreen"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
